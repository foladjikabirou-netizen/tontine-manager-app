<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tontine Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'primary': {
                '50': '#f0f9ff',
                '100': '#e0f2fe',
                '200': '#bae6fd',
                '300': '#7dd3fc',
                '400': '#38bdf8',
                '500': '#0ea5e9',
                '600': '#0284c7',
                '700': '#0369a1',
                '800': '#075985',
                '900': '#0c4a6e',
                '950': '#082f49',
              },
            }
          }
        }
      }
    </script>
    <!-- SystemJS for module loading and in-browser transpilation -->
    <script src="https://unpkg.com/systemjs@6.14.3/dist/s.min.js"></script>
    <script src="https://unpkg.com/systemjs-babel@6.5.0/dist/systemjs-babel.js"></script>

    <script type="systemjs-config">
      {
        "map": {
          "react": "https://aistudiocdn.com/react@^19.1.1",
          "react-dom/client": "https://aistudiocdn.com/react-dom@^19.1.1/client"
        },
        "meta": {
          "*.tsx": {
            "loader": "systemjs-babel",
            "babelOptions": {
              "presets": ["react", "typescript"]
            }
          },
          "*.ts": {
              "loader": "systemjs-babel",
              "babelOptions": {
              "presets": ["typescript"]
            }
          }
        }
      }
    </script>
<script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="systemjs-import">
      System.import('./index.tsx');
    </script>
  </body>
</html>
